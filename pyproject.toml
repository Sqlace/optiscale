[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optiscale"
version = "0.1.0"
description = "Optimizer-aware LLM scaling laws: allocate, fit, cost, and compare beyond AdamW-Chinchilla."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Spectral Training Stack" }]
keywords = ["scaling-laws", "chinchilla", "muon", "llm", "optimizer", "compute"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
optiscale = "optiscale.cli:main"

[project.urls]
Homepage = "https://github.com/Sqlace/optiscale"
Documentation = "https://github.com/Sqlace/optiscale"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
